name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in Directory.Build.props. Integration restores the packages just built from
      # ../nugets by IntegrationVersion, so it has to be told the same version.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "INTEGRATION_ARGUMENT=-p:IntegrationVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore Fody
        run: dotnet restore Fody.sln ${{ env.VERSION_ARGUMENT }}

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln ${{ env.VERSION_ARGUMENT }}

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln ${{ env.INTEGRATION_ARGUMENT }}

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln ${{ env.INTEGRATION_ARGUMENT }}

      - name: Test
        run: ./runTests.ps1
        shell: pwsh

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-windows
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: warn
          retention-days: 30

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Fody
        run: dotnet restore Fody.sln

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln

# TODO Run the Fody tests when they pass on Linux
      - name: Test Integration
        run: ./runTests.ps1 -IntegrationOnly -Framework net10.0
        shell: pwsh

  e2e-build:
    name: E2E Build
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      build-version: ${{ steps.version.outputs.build-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Use a unique, unpublished version so we're certain nuget.org has no package with this
      # id/version, and that the e2e tests exercise exactly this build.
      - name: Generate Build Version
        id: version
        shell: pwsh
        run: |
          [xml]$projectXml = Get-Content "Directory.Build.props"
          $propertyGroup = $projectXml.Project.PropertyGroup | Select -First 1
          $version = [System.Version]$propertyGroup.Version.'#text'
          $buildVersion = [System.Version]"99.$($version.Major).$($version.Minor).$($version.Build)"
          echo "build-version=$buildVersion" >> $env:GITHUB_OUTPUT

      - name: Log Build Version
        run: echo "Build Version = ${{ steps.version.outputs.build-version }}"

      - name: Build Fody
        run: dotnet build Fody.sln -c Release -p:Version=${{ steps.version.outputs.build-version }}

      - name: Cache packages
        uses: actions/cache/save@v4
        with:
          path: nugets/*.nupkg
          key: nupkgs-e2e-${{ github.run_id }}-${{ github.run_attempt }}

  e2e-tests:
    name: E2E Tests
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'VS2026'
            image: 'windows-2025-vs2026'
            vsVersion: '18.0'
          - name: 'VS2022'
            image: 'windows-2022'
            vsVersion: '17.0'
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - name: Checkout FodyIntegrationTest
        uses: actions/checkout@v7
        with:
          repository: tom-englert/FodyIntegrationTest
          path: FodyIntegrationTest

      - name: Restore cached packages
        uses: actions/cache/restore@v4
        with:
          path: nugets/*.nupkg
          key: nupkgs-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Copy nuget to integration source folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path FodyIntegrationTest\nuget | Out-Null
          Copy-Item nugets\*.nupkg FodyIntegrationTest\nuget\

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: ${{ matrix.vsVersion }}

      - name: Build solution
        run: msbuild FodyIntegrationTest\FodyIntegrationTest.sln -restore -p:Platform="any cpu" -p:Configuration=Release

      - name: Test
        run: dotnet test FodyIntegrationTest\Test\Test.csproj --no-build -c Release

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: [windows, linux, e2e-tests]
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
