name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in Directory.Build.props. Integration restores the packages just built from
      # ../nugets by IntegrationVersion, so it has to be told the same version.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "INTEGRATION_ARGUMENT=-p:IntegrationVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore Fody
        run: dotnet restore Fody.sln ${{ env.VERSION_ARGUMENT }}

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln ${{ env.VERSION_ARGUMENT }}

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln ${{ env.INTEGRATION_ARGUMENT }}

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln ${{ env.INTEGRATION_ARGUMENT }}

      - name: Test
        run: ./runTests.ps1
        shell: pwsh

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-windows
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: warn
          retention-days: 30

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Fody
        run: dotnet restore Fody.sln

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln

# TODO Run the Fody tests when they pass on Linux
      - name: Test Integration
        run: ./runTests.ps1 -IntegrationOnly -Framework net10.0
        shell: pwsh

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: [windows, linux]
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
