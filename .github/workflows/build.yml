
name: Build
on: [push, pull_request]

env:
  DOTNET_NOLOGO: 1

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x.x

      - name: Restore Fody
        run: dotnet restore Fody.sln

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln

      - name: Test
        run: ./runTests.ps1
        shell: pwsh

      - name: Upload NuGet
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: nugets/*.nupkg

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x.x

      - name: Restore Fody
        run: dotnet restore Fody.sln

      - name: Build Fody
        run: dotnet build --configuration Release --no-restore Fody.sln

      - name: Restore Integration
        run: dotnet restore Integration/Integration.sln

      - name: Build Integration
        run: dotnet build --configuration Release --no-restore Integration/Integration.sln

# TODO Run the Fody tests when they pass on Linux
      - name: Test Integration
        run: ./runTests.ps1 -IntegrationOnly -Framework net8.0
        shell: pwsh
